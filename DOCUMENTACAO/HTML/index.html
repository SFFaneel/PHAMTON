<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal | Documentação Técnica</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Apenas a composição do portal; cores e tipografia vêm de style.css. */
    .portal-app { display:grid; grid-template-columns:288px minmax(0,1fr); min-height:100vh; }
    .portal-app .sidebar { display:flex; flex-direction:column; }
    .portal-app .brand { margin-bottom:18px; }
    .portal-app .portal-nav { display:flex; flex-direction:column; gap:5px; }
    .portal-app .portal-link { width:100%; display:flex; align-items:center; gap:10px; padding:11px 12px; border:0; border-radius:9px; background:transparent; color:var(--text); text-align:left; cursor:pointer; }
    .portal-app .portal-link:hover, .portal-app .portal-link.active { background:#1b3141; color:var(--accent); }
    .portal-app .portal-link .module-icon { width:22px; text-align:center; }
    .portal-app .portal-link .module-title { flex:1; }
    .portal-app .portal-side-note { margin-top:auto; padding:18px 12px 0; border-top:1px solid var(--border); color:var(--muted); font-size:12px; }
    .portal-app .portal-main { min-width:0; display:flex; flex-direction:column; height:100vh; }
    .portal-app .portal-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; padding:21px 30px; border-bottom:1px solid var(--border); background:var(--panel); }
    .portal-app .portal-eyebrow { color:var(--accent); letter-spacing:1.6px; font-size:10px; font-weight:700; }
    .portal-app .portal-title { margin:5px 0 2px; font-size:23px; color:var(--text); line-height:1.3; }
    .portal-app .portal-description { margin:0; color:var(--muted); font-size:12px; }
    .portal-app .portal-open { display:inline-block; padding:8px 12px; border:1px solid var(--border); border-radius:8px; color:var(--accent2); font-size:12px; white-space:nowrap; }
    .portal-app .portal-open:hover { color:var(--accent); border-color:var(--accent); }
    .portal-app .portal-frame { display:block; width:100%; flex:1; min-height:0; border:0; background:var(--bg); }
    .portal-app .portal-select { display:none; width:100%; border:1px solid var(--border); border-radius:8px; background:var(--panel2); color:var(--text); padding:10px; }
    .portal-app [hidden] { display:none !important; }
    .portal-app .portal-welcome { flex:1; overflow:auto; padding:clamp(22px,5vw,62px); background:var(--bg); }
    .portal-app .welcome-inner { max-width:960px; margin:0 auto; }
    .portal-app .welcome-kicker { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
    .portal-app .welcome-heading { font-size:clamp(28px,4vw,43px); line-height:1.18; margin:14px 0 18px; color:var(--text); }
    .portal-app .welcome-lead { font-size:16px; line-height:1.8; color:var(--text); max-width:790px; }
    .portal-app .welcome-status { display:inline-flex; margin:20px 0 30px; padding:9px 14px; border:1px solid var(--border); border-radius:8px; color:var(--accent); background:var(--panel); font-size:12px; font-weight:700; }
    .portal-app .welcome-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-top:12px; }
    .portal-app .welcome-card { padding:23px; border:1px solid var(--border); border-radius:12px; background:var(--panel); }
    .portal-app .welcome-card h3 { margin:0 0 12px; font-size:17px; color:var(--text); }
    .portal-app .welcome-card p { color:var(--muted); line-height:1.7; font-size:13px; }
    .portal-app .welcome-action { display:inline-block; margin-top:12px; color:var(--accent); font-weight:700; cursor:pointer; border:0; background:none; padding:0; font:inherit; }
    .portal-app .welcome-footnote { margin-top:32px; color:var(--muted); font-size:13px; line-height:1.7; }
    @media(max-width:760px) {
      .portal-app { display:block; }
      .portal-app .sidebar { display:none; }
      .portal-app .portal-main { height:100vh; }
      .portal-app .portal-header { padding:15px; }
      .portal-app .portal-title { font-size:19px; }
      .portal-app .portal-select { display:block; }
    }
  </style>
</head>
<body>
  <div class="portal-app">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <div class="logo">⑂</div>
        <div><strong>PHAMTON'S FANG</strong><small>DOCUMENTAÇÃO</small></div>
      </div>
      <div class="nav-caption">DOCUMENTOS</div>
      <nav class="portal-nav" id="portal-nav" aria-label="Documentos disponíveis"></nav>
      <div class="portal-side-note">Em desenvolvimento.</div>
    </aside>
    <main class="portal-main">
      <header class="portal-header">
        <div>
          <div class="portal-eyebrow">DOCUMENTAÇÃO TÉCNICA</div>
          <h1 class="portal-title" id="portal-title">Introdução</h1>
          <p class="portal-description" id="portal-description"></p>
        </div>
        <a class="portal-open" id="portal-open" href="DADOS_FUNCOES.html" target="_blank" rel="noopener noreferrer" hidden>Abrir em nova aba ↗</a>
        <select class="portal-select" id="portal-select" aria-label="Selecionar documento"></select>
      </header>
      <iframe class="portal-frame" id="portal-frame" title="Documento selecionado" hidden></iframe>
    </main>
  </div>
  <script>
    const DOCUMENTOS = [
      { id:'inicio', titulo:'Introdução', arquivo:'inicio.html', descricao:'Apresentação e estado atual da documentação.', icone:'⌂' },
      { id:'dados', titulo:'Dados e Funções', arquivo:'DADOS_FUNCOES.html', descricao:'Catálogo de módulos, funções e documentação técnica.', icone:'▣' },
      { id:'pipeline', titulo:'Pipeline Principal', arquivo:'PIPELINE_PRINCIPAL.html', descricao:'Fluxos operacionais, páginas e pipelines da aplicação.', icone:'⑂' }
    ];
    const nav = document.getElementById('portal-nav');
    const seletor = document.getElementById('portal-select');
    const frame = document.getElementById('portal-frame');
    const titulo = document.getElementById('portal-title');
    const descricao = document.getElementById('portal-description');
    const abrir = document.getElementById('portal-open');
    function selecionar(id) {
      const documento = DOCUMENTOS.find(d => d.id === id) || DOCUMENTOS[0];
      titulo.textContent = documento.titulo;
      descricao.textContent = documento.descricao;
      abrir.href = documento.arquivo;
      abrir.hidden = false;
      frame.hidden = false;
      if (frame.getAttribute('src') !== documento.arquivo) frame.src = documento.arquivo;
      seletor.value = documento.id;
      nav.querySelectorAll('.portal-link').forEach(b => {
        const ativo = b.dataset.id === documento.id;
        b.classList.toggle('active', ativo);
        if (ativo) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
      });
      history.replaceState(null, '', '#' + encodeURIComponent(documento.id));
    }
    DOCUMENTOS.forEach(doc => {
      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'portal-link';
      botao.dataset.id = doc.id;
      const icone = document.createElement('span');
      icone.className = 'module-icon';
      icone.textContent = doc.icone;
      const texto = document.createElement('span');
      texto.className = 'module-title';
      texto.textContent = doc.titulo;
      botao.append(icone, texto);
      botao.addEventListener('click', () => selecionar(doc.id));
      nav.append(botao);
      const opcao = document.createElement('option');
      opcao.value = doc.id;
      opcao.textContent = doc.titulo;
      seletor.append(opcao);
    });
    document.querySelectorAll('[data-open-doc]').forEach(b => b.addEventListener('click', () => selecionar(b.dataset.openDoc)));
    seletor.addEventListener('change', () => selecionar(seletor.value));
    window.addEventListener('hashchange', () => selecionar(decodeURIComponent(location.hash.slice(1))));
    selecionar(decodeURIComponent(location.hash.slice(1)));
  </script>
</body>
</html>
