Realiza a importação dos arquivos CSV do Manual de Dados da SFF para uma base de dados local, que será utilizada pelos procedimentos de análise e fiscalização.
A importação organiza os dados recebidos em estruturas adequadas à consulta e ao processamento, permitindo que os módulos posteriores trabalhem com informações armazenadas localmente.
O processo também contempla a implantação de um manifesto de dados destinado a apoiar a trilha de auditoria. Esse manifesto registra informações sobre os arquivos importados, incluindo sua identificação e o hash SHA-256, permitindo verificar a integridade dos arquivos e acompanhar sua proveniência.

{
    "grupo": "IMPORTAR:",
    "titulo": "EFD ICMS/IPI",

    "source": [
        "function",
        "imp_SPED_EFD_ICMS"
    ],

    "objetivo": `
Realiza a importação dos arquivos da Escrituração Fiscal Digital do ICMS e do IPI (EFD ICMS/IPI), integrantes do Sistema Público de Escrituração Digital (SPED), para uma base de dados local destinada aos procedimentos de análise e fiscalização.
O módulo Imp_SPED.py identifica o tipo de escrituração contido nos arquivos e organiza os registros na estrutura de banco de dados correspondente, respeitando as características dos diferentes leiautes fiscais.
Durante o processamento, são realizados procedimentos de limpeza e tratamento de caracteres não reconhecidos ou incompatíveis, com o objetivo de reduzir falhas de leitura e permitir a importação dos registros.
A página também disponibiliza uma tabela de controle dos arquivos, apresentando informações sobre os períodos de referência, o CNPJ e os nomes dos arquivos utilizados.
Para assegurar a correspondência entre os dados analisados e as escriturações efetivamente transmitidas, deve-se conferir o recibo de entrega da EFD ICMS/IPI, verificando se o arquivo utilizado corresponde à versão entregue à administração tributária.
    `,

    "entradas": `
ARQUIVOS DE ORIGEM

Arquivos digitais da EFD ICMS/IPI, previamente disponibilizados na pasta EFD_ICMS, conforme a organização do ambiente de trabalho.

PRÉ-REQUISITOS

Ambiente de trabalho configurado, arquivos fiscais disponíveis e períodos de referência identificados.

IDENTIFICAÇÃO DA ESCRITURAÇÃO

O módulo Imp_SPED.py identifica o tipo de escrituração e direciona o processamento para a estrutura de dados correspondente.

CONTROLE DE REIMPORTAÇÃO

A opção "Apagar banco de dados?" permite solicitar a exclusão da base existente, conforme o comportamento implementado na rotina de importação.
Caso esteja inabilitado faz a importação apenas de arquivos não presentes na base.

COMPROVAÇÃO DA ENTREGA

Recibos de entrega das escriturações transmitidas, utilizados para conferir a correspondência entre os arquivos importados e aqueles efetivamente entregues à Receita Federal.
Se necessário cálcule o HASH do arquivo, conforme padrão da receita, e valide o arquivo empregado.    `,

    "resultados": `
BASE DE DADOS LOCAL

Registros da EFD ICMS/IPI importados e organizados em estruturas próprias, permitindo consultas e análises posteriores.

TRATAMENTO DOS ARQUIVOS

Dados processados com tratamento dos caracteres incompatíveis identificados durante a leitura, conforme as rotinas implementadas.

CONTROLE DOS ARQUIVOS IMPORTADOS

Tabela contendo os períodos inicial e final, o CNPJ e o nome do arquivo de origem, permitindo identificar as escriturações utilizadas.

CONFERÊNCIA DOCUMENTAL

Possibilidade de verificar a correspondência entre os arquivos de origem e os respectivos recibos de entrega, contribuindo para a confiabilidade da documentação utilizada nas análises.
    `,

    "observacoes": `
CONFERÊNCIA DOS RECIBOS DE ENTREGA

A existência de um arquivo EFD ICMS/IPI no diretório de trabalho não comprova, isoladamente, que ele corresponda à escrituração efetivamente entregue à Receita Federal.
É necessário conferir o recibo de entrega e verificar a identificação do contribuinte, o período de referência e a correspondência com o arquivo utilizado.

    "source": [

        "AMOSTRAS_D"
    ],

    "objetivo": `
Efetuar análise exploratória dos investimentos e a seleção de projetos para fiscalização, utilizando procedimentos de amostragem por unidade monetária e estratificação por tipo de instalação (TI).
Inicialmente, são examinadas as distribuições dos valores dos investimentos, permitindo identificar concentração, dispersão, assimetria e valores extremos. A análise apresenta separadamente a população completa, os registros sem outliers e os registros classificados como outliers.
A visualização utiliza gráficos do tipo violino, combinados com informações de distribuição e estatísticas descritivas, para apoiar a interpretação do comportamento dos investimentos por TI.
Os outliers são apresentados para avaliação do usuário. Sua identificação estatística não implica exclusão automática, pois obras de maior valor podem representar investimentos legítimos e relevantes para a fiscalização.
Na etapa seguinte, o sistema apresenta a distribuição monetária dos investimentos e aplica a metodologia de Amostragem por Unidade Monetária, utilizada para selecionar registros com maior relevância financeira.
A amostra é dimensionada considerando parâmetros estatísticos de confiança, erro tolerável e critérios definidos no procedimento. Posteriormente, é distribuída entre os estratos de TI, considerando sua representatividade monetária.
Por fim, a página apresenta os projetos selecionados para análise em campo e permite exportar os resultados para utilização nas etapas posteriores da fiscalização.
    `,

    "entradas": `
BASE DE INVESTIMENTOS

Registros dos projetos e obras associados ao AIS, contendo informações de identificação, classificação por TI e valores monetários dos investimentos.

DADOS DE ESTRATIFICAÇÃO

    function elemento(tag, classe, texto) {
      const node = document.createElement(tag);
      if (classe) node.className = classe;
      if (texto !== undefined) node.textContent = String(texto);
      return node;
    }

    function criarParagrafos(texto, rotulo = '') {
      const container = elemento('div', 'texto-documentacao');
      const blocos = String(texto ?? '').trim().split(/\n\s*\n/)
        .map(b => b.trim().replace(/\s*\n\s*/g, ' ')).filter(Boolean);
      let tabela = null;
      const finalizarTabela = () => { if (tabela) { container.append(tabela); tabela = null; } };

      blocos.forEach(bloco => {
        const ehSubtitulo = bloco.length <= 75 && /[A-ZÀ-Ý]/.test(bloco) &&
          !/[a-zà-ÿ]/.test(bloco) && !/[.!?]$/.test(bloco);
        if (ehSubtitulo) {
          finalizarTabela();
          container.append(elemento('h3', 'subtitulo-documentacao', bloco));
          return;
        }

        const entradaTecnica = rotulo === 'Entradas e pré-requisitos' &&
          /^([^:]{3,90}):\s*(.+)$/.exec(bloco);
        if (entradaTecnica) {
          if (!tabela) tabela = elemento('table', 'doc-data-table');
          const linha = document.createElement('tr');
          linha.append(elemento('th', '', entradaTecnica[1]));
          linha.append(elemento('td', '', entradaTecnica[2]));
          tabela.append(linha);
          return;
        }
        finalizarTabela();
        container.append(elemento('p', '', bloco));
      });
      finalizarTabela();
      return container;
    }

    function campo(container, rotulo, valor) {
      const section = elemento('div', 'field');
      const titulo = elemento('strong');
      const icones = {
        'Objetivo': '◎',
        'Entradas e pré-requisitos': '▣',
        'Resultados esperados': '✓',
        'Observações': 'ⓘ',
        'Finalidade': '◎',
        'Acionamento': '▶',
        'Funções / módulos envolvidos': '⌘',
        'Resultado': '✓'
      };
      titulo.append(elemento('span', 'field-icon', icones[rotulo] || '•'));
      titulo.append(document.createTextNode(rotulo));
      section.append(titulo);
      const texto = String(valor ?? '').trim();
      const descricao = criarParagrafos(texto || '—', rotulo);
      if (texto.startsWith('[')) descricao.classList.add('placeholder');
      section.append(descricao);
      container.append(section);
    }

function criarTabelaParametrosP1(parametros) {

function criarInterface(pagina) {
    const dados = pagina.interface;
    if (!dados) return null;

    const imagensExtras = dados.imagens_adicionais || dados.galeria || [];

    if (!dados.imagem && !imagensExtras.length) return null;

    const card = elemento('section', 'interface-card');
    card.id = 'interface-operacional';

    card.append(
        elemento('h2', '', 'Interface operacional')
    );

    card.append(
        elemento(
            'p',
            'interface-intro',
            'Consulte as capturas e as orientações operacionais. Clique nas imagens para ampliar.'
        )
    );

    // Ampliação reutilizável para todas as capturas.
    function configurarAmpliacao(img, caminho) {
        img.tabIndex = 0;
        img.setAttribute('role', 'button');
        img.setAttribute('aria-label', 'Ampliar captura da tela');

        const ampliar = () => {
            const dialog = document.createElement('dialog');
            dialog.className = 'image-dialog';

            const fechar = elemento('button', '', 'Fechar ✕');
            fechar.type = 'button';

            fechar.addEventListener('click', () => dialog.close());

            const imagem = elemento('img');
            imagem.src = caminho;
            imagem.alt = img.alt;

            dialog.append(fechar, imagem);

            dialog.addEventListener('click', e => {
                if (e.target === dialog) dialog.close();
            });

            dialog.addEventListener('close', () => dialog.remove());

            document.body.append(dialog);
            dialog.showModal();
        };

        img.addEventListener('click', ampliar);

        img.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                ampliar();
            }
        });
    }

    // 1. Imagem principal e marcadores.
    if (dados.imagem) {
        const figure = elemento('figure', 'interface-figure');
        const wrap = elemento('div', 'interface-image-wrap');

        const img = elemento('img', 'interface-image');
        img.src = dados.imagem;
        img.alt = dados.legenda || 'Captura da interface Streamlit';
        img.loading = 'lazy';

        configurarAmpliacao(img, dados.imagem);

        wrap.append(img);

        (dados.elementos || []).forEach(item => {
            if (
                typeof item.x !== 'number' ||
                typeof item.y !== 'number'
            ) return;

            const marker = elemento(
                'button',
                'interface-marker',
                item.numero
            );

            marker.type = 'button';
            marker.style.left = item.x + '%';
            marker.style.top = item.y + '%';
            marker.title = item.titulo;

            marker.setAttribute(
                'aria-label',
                item.numero + '. ' + item.titulo
            );

            marker.addEventListener('click', () => {
                document
                    .getElementById('interface-passo-' + item.numero)
                    ?.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
            });

            wrap.append(marker);
        });

        figure.append(wrap);

        if (dados.legenda) {
            figure.append(
                elemento('figcaption', 'interface-caption', dados.legenda)
            );
        }

        card.append(figure);
    }

    // 2. Descrição dos controles numerados.
    if (dados.elementos?.length) {
        const lista = elemento('div', 'interface-elements');

        dados.elementos.forEach(item => {
            const passo = elemento('article', 'interface-step');
            passo.id = 'interface-passo-' + item.numero;

            const titulo = elemento('div', 'interface-step-title');

            titulo.append(
                elemento('span', 'interface-number', item.numero)
            );

            titulo.append(document.createTextNode(item.titulo));

            passo.append(
                titulo,
                elemento('p', '', item.descricao)
            );

            lista.append(passo);
        });

        card.append(lista);
    }

    // 3. Galeria de imagens complementares.
    if (imagensExtras.length) {
        const galeria = elemento('div', 'interface-gallery');

        galeria.append(
            elemento('h3', 'interface-gallery-heading', 'Etapas ilustradas')
        );

        imagensExtras.forEach((item, indice) => {
            if (!item.imagem) return;

            const figure = elemento(
                'figure',
                'interface-gallery-item'
            );

            const titulo = elemento(
                'h4',
                'interface-gallery-title',
                item.titulo || `Etapa ${indice + 2}`
            );

            const wrap = elemento(
                'div',
                'interface-gallery-image-wrap'
            );

            const img = elemento(
                'img',
                'interface-gallery-image'
            );

            img.src = item.imagem;
            img.alt = item.legenda || item.titulo || 'Captura complementar';
            img.loading = 'lazy';

            configurarAmpliacao(img, item.imagem);

            wrap.append(img);
            figure.append(titulo, wrap);

            if (item.legenda) {
                figure.append(
                    elemento(
                        'figcaption',
                        'interface-caption',
                        item.legenda
                    )
                );
            }

            galeria.append(figure);
        });

        card.append(galeria);
    }

    // 4. Nota complementar.
    if (dados.nota) {
        card.append(
            elemento('p', 'interface-note', dados.nota)
        );
    }

    return card;
}

      if (pagina.grupo !== ultimoGrupo) {
        nav.append(elemento('div', 'group-name', pagina.grupo));
        ultimoGrupo = pagina.grupo;
      }
      const botao = elemento('button', 'page-nav', pagina.titulo);
      botao.type = 'button';
      botao.addEventListener('click', () => mostrarPagina(indice));
      nav.append(botao);
    });
    if (DOCUMENTACAO_PAGINAS.length) mostrarPagina(0);
  </script>
</body>
</html>
